status-website:
  logoUrl: https://www.factchat.bot/favicon.ico
  name: FactChat Status
  introTitle: '**FactChat** 서비스 상태'
  introMessage: 팩트챗 서비스의 실시간 가동 상태와 과거 장애 이력입니다.
  customHeadHtml: '<style> :root{--body-background-color:#fff!important;--body-text-color:#1f2328!important; --card-background-color:#fff!important;--nav-background-color:#fff!important; --nav-border-bottom-color:#d1d9e0!important;--card-border-color:#d1d9e0!important; --nav-current-border-bottom-color:#fd8c73!important;--up-border-left-color:#1f883d!important; --degraded-border-left-color:#9a6700!important;--down-border-left-color:#cf222e!important; --tag-up-background-color:#1f883d!important;--tag-degraded-background-color:#9a6700!important; --tag-down-background-color:#cf222e!important;--graph-opacity:.45!important} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif!important; background:#fff!important;color:#1f2328!important;line-height:1.5!important} .container{max-width:880px!important;padding:0 16px!important} nav{border-bottom:1px solid #d1d9e0!important;background:#fff!important} h1{font-size:24px!important;font-weight:600!important;letter-spacing:-.2px!important} h2{font-size:16px!important;font-weight:600!important;color:#59636e!important} h3{font-size:14px!important;font-weight:600!important;color:#59636e!important;opacity:1!important} h4{font-size:15px!important;font-weight:600!important;margin:0!important} section.live-status{border:1px solid #d1d9e0!important;border-radius:6px!important;overflow:hidden!important} section.live-status article{border:0!important;border-radius:0!important;background:#fff!important; padding:16px 20px!important;margin:0!important} section.live-status article+article{border-top:1px solid #d1d9e0!important;margin-top:0!important} section.live-status article>div{font-size:13px!important;color:#59636e!important} section.live-status article .data{color:#1f2328!important;font-weight:600!important} .tag{border-radius:2em!important;font-size:12px!important;font-weight:500!important; padding:2px 10px!important;letter-spacing:.2px!important} #fc-banner{border-radius:6px!important;padding:14px 20px!important;margin:0 0 24px!important; color:#fff!important;font-weight:600!important;font-size:16px!important} #fc-banner.ok{background:#1f883d!important} #fc-banner.degraded{background:#9a6700!important} #fc-banner.down{background:#cf222e!important} a{text-decoration:none!important}a:hover{text-decoration:underline!important} </style><script>(function(){var t=setInterval(function(){var a=document.querySelectorAll(''section.live-status article'');if(!a.length)return;var d=0,g=0;a.forEach(function(x){if(x.classList.contains(''down''))d++;else if(x.classList.contains(''degraded''))g++;});var e=document.getElementById(''fc-banner'');if(!e){e=document.createElement(''div'');e.id=''fc-banner'';var s=document.querySelector(''section.live-status'');s.parentNode.insertBefore(e,s);}if(d){e.className=''down'';e.textContent=''\u26A0 ''+d+''\uAC1C \uC11C\uBE44\uC2A4 \uC7A5\uC560'';}else if(g){e.className=''degraded'';e.textContent=''\u26A0 \uC77C\uBD80 \uC11C\uBE44\uC2A4 \uC131\uB2A5 \uC800\uD558'';}else{e.className=''ok'';e.textContent=''\u2713 \uBAA8\uB4E0 \uC11C\uBE44\uC2A4 \uC815\uC0C1'';}},400);setTimeout(function(){clearInterval(t);},30000);})();</script>'
  navbar:
  - title: Status
    href: /
  - title: GitHub
    href: https://github.com/mindlogic-ai/factchat-status
  theme: light
workflowSchedule:
  uptime: '*/5 * * * *'
  responseTime: 0 23 * * *
  graphs: 0 0 * * *
  staticSite: 0 1 * * *
  summary: 0 0 * * *
assignees:
- spark33
commitMessages:
  readmeContent: ':pencil: Update summary in README [skip ci] [upptime]'
  summaryContent: ':card_file_box: Update status summary [skip ci] [upptime]'
  statusChange: $EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]

