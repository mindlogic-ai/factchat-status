# FactChat public status page — https://status.factchat.bot
# Upptime config. Docs: https://upptime.js.org/docs/configuration
owner: mindlogic-ai
repo: factchat-status

sites:
  # --- Live (verified 2026-08-05) ---
  - name: Web App
    url: https://mindlogic.factchat.bot/api/health
    # NOTE: the app lives on tenant subdomains. factchat.bot apex is the landing page
    # and has no /api/health. mindlogic.* is our own tenant — safe to probe.

  - name: Landing Page
    url: https://factchat.bot

  - name: Docs
    url: https://docs.mindlogic.ai

  - name: Gateway API
    url: https://factchat-cloud.mindlogic.ai/
    # PROVISIONAL: root returns 200 but proves little. /v1/gateway is 404 without an
    # API key. Repoint at a real unauthenticated /health once FTC-1955 lands.

  # --- Pending health endpoints (FTC-1957 / FTC-1958). Uncomment when deployed. ---
  # - name: Chat API
  #   url: https://<eb-alb-host>/health
  # - name: Login & SSO
  #   url: https://<sso-host>/health
  # - name: File Upload & OCR
  #   url: https://<docparse-alb-host>/health
  # - name: KBS (private cloud)
  #   url: https://<kbs-ncp-host>/api/health
  # - name: SNU (private cloud)
  #   url: https://<snu-ncp-host>/api/health
  #
  # EXCLUDED: SGI (sgi-factchat) — IP-allowlisted, unreachable from GitHub runners.

status-website:
  # cname: status.factchat.bot   # 커스텀 도메인 보류 — *.factchat.bot 와일드카드가 Vercel 로 가 있어 status 도 삼켜진다.
  logoUrl: https://www.factchat.bot/favicon.ico
  name: FactChat Status
  introTitle: "**FactChat** 서비스 상태"
  introMessage: 팩트챗 서비스의 실시간 가동 상태와 과거 장애 이력입니다.
  # githubstatus.com 스타일. status-page 의 customHeadHtml 훅으로 주입한다(포크 불필요).
  customHeadHtml: >
    <link rel="preconnect" href="https://fonts.googleapis.com"><style>
    :root{--body-background-color:#fff;--body-text-color:#1f2328;--card-background-color:#fff;
    --nav-background-color:#fff;--nav-border-bottom-color:#d1d9e0;--card-border-color:#d1d9e0;
    --nav-current-border-bottom-color:#fd8c73;--up-border-left-color:#1f883d;
    --degraded-border-left-color:#9a6700;--down-border-left-color:#cf222e;
    --tag-up-background-color:#1f883d;--tag-degraded-background-color:#9a6700;
    --tag-down-background-color:#cf222e;--graph-opacity:.5}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
    line-height:1.5;color:#1f2328;background:#fff}
    .container{max-width:880px;padding:0 16px}
    nav{border-bottom:1px solid #d1d9e0}
    nav .container{display:flex;gap:24px;font-size:14px}
    h1{font-size:24px;font-weight:600;letter-spacing:-.2px}
    h2{font-size:16px;font-weight:600;color:#59636e;text-transform:none}
    h3{font-size:14px;font-weight:600;color:#59636e;opacity:1}
    h4{font-size:15px;font-weight:600;margin:0}
    /* 컴포넌트 행 — 카드 대신 구분선 목록 (githubstatus 와 동일) */
    section.live-status{border:1px solid #d1d9e0;border-radius:6px;overflow:hidden}
    section.live-status article{border:0!important;border-radius:0;background:#fff;
    padding:16px 20px;margin:0}
    section.live-status article+article{border-top:1px solid #d1d9e0!important;margin-top:0}
    section.live-status article.up,section.live-status article.degraded,
    section.live-status article.down{border-left:0!important}
    section.live-status article>div{font-size:13px;color:#59636e}
    section.live-status article .data{color:#1f2328;font-weight:600}
    /* 상태 배지 — 좌측 색 막대 대신 우측 텍스트 */
    .tag{border-radius:2em;font-size:12px;font-weight:500;padding:2px 10px;letter-spacing:.2px}
    /* 전체 상태 배너 */
    #fc-banner{border-radius:6px;padding:14px 20px;margin:0 0 24px;color:#fff;font-weight:600;
    font-size:16px;display:flex;align-items:center;gap:10px}
    #fc-banner.ok{background:#1f883d}#fc-banner.degraded{background:#9a6700}
    #fc-banner.down{background:#cf222e}
    .f.changed form{font-size:13px}
    a{text-decoration:none}a:hover{text-decoration:underline}
    </style><script>
    // 전체 상태 배너: 개별 모니터 상태에서 계산한다. 값을 지어내지 않고 DOM 이 준비된 뒤에만 그린다.
    (function(){var t=null;function draw(){
      var arts=document.querySelectorAll("section.live-status article");if(!arts.length)return false;
      var down=0,deg=0;arts.forEach(function(a){if(a.classList.contains("down"))down++;
      else if(a.classList.contains("degraded"))deg++;});
      var el=document.getElementById("fc-banner");
      if(!el){el=document.createElement("div");el.id="fc-banner";
      var s=document.querySelector("section.live-status");s.parentNode.insertBefore(el,s);}
      if(down){el.className="down";el.textContent="\u26A0 "+down+"\uAC1C \uC11C\uBE44\uC2A4 \uC7A5\uC560";}
      else if(deg){el.className="degraded";el.textContent="\u26A0 \uC77C\uBD80 \uC11C\uBE44\uC2A4 \uC131\uB2A5 \uC800\uD558";}
      else{el.className="ok";el.textContent="\u2713 \uBAA8\uB4E0 \uC11C\uBE44\uC2A4 \uC815\uC0C1";}
      return true;}
    t=setInterval(function(){if(draw())clearInterval(t);},400);
    setTimeout(function(){clearInterval(t);},20000);})();
    </script>
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/mindlogic-ai/factchat-status

# Probe cadence — GitHub Actions schedules drift; 5min is the practical floor.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"

assignees:
  - spark33

commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci] [upptime]"
  summaryContent: ":card_file_box: Update status summary [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
