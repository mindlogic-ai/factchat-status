# FactChat public status page — https://mindlogic-ai.github.io/factchat-status/
# Upptime config. Docs: https://upptime.js.org/docs/configuration
# 모니터 이름은 바꿔도 slug 는 고정한다 — history/·api/ 경로와 가동률 막대가 유지된다.
# 커스텀 도메인(status.factchat.bot) 보류 — *.factchat.bot 와일드카드가 Vercel 로 간다.
owner: mindlogic-ai
repo: factchat-status
sites:
  - name: FactChat Service (app.factchat.bot)
    slug: web-app
    url: https://mindlogic.factchat.bot/api/health
  - name: FactChat Homepage (www.factchat.bot)
    slug: landing-page
    url: https://factchat.bot
  - name: Docs
    slug: docs
    url: https://docs.mindlogic.ai
  - name: API & API Gateway
    slug: chat-api-gateway
    url: https://factchat-cloud.mindlogic.ai/health/
  - name: NCP (전용 클라우드)
    slug: ncp
    url: https://kbs.factchat.kr/api/health
status-website:
  baseUrl: /factchat-status
  logoUrl: https://www.factchat.bot/favicon.ico
  name: FactChat Status
  introTitle: '**FactChat** 서비스 상태'
  introMessage: 팩트챗 서비스의 실시간 가동 상태와 과거 장애 이력입니다.
  customHeadHtml: |-
    <meta name="description" content="팩트챗(FactChat) 서비스의 실시간 가동 상태와 과거 장애 이력. 서비스·홈페이지·API 게이트웨이·전용 클라우드(NCP)의 90일 가동률을 확인할 수 있습니다."><link rel="canonical" href="https://mindlogic-ai.github.io/factchat-status/"><meta property="og:type" content="website"><meta property="og:site_name" content="FactChat Status"><meta property="og:locale" content="ko_KR"><meta property="og:title" content="FactChat 서비스 상태"><meta property="og:description" content="팩트챗(FactChat) 서비스의 실시간 가동 상태와 과거 장애 이력. 서비스·홈페이지·API 게이트웨이·전용 클라우드(NCP)의 90일 가동률을 확인할 수 있습니다."><meta property="og:url" content="https://mindlogic-ai.github.io/factchat-status/"><meta property="og:image" content="https://mindlogic-ai.github.io/factchat-status/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="FactChat 서비스 상태"><meta name="twitter:description" content="팩트챗(FactChat) 서비스의 실시간 가동 상태와 과거 장애 이력. 서비스·홈페이지·API 게이트웨이·전용 클라우드(NCP)의 90일 가동률을 확인할 수 있습니다."><meta name="twitter:image" content="https://mindlogic-ai.github.io/factchat-status/og.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>/* FactChat Status — logician-ui 토큰 기반 테마.
       customHeadHtml 은 Upptime 의 테마·global.css 보다 먼저 주입되므로 !important 가 필요하다.
       토큰 출처: mindlogic-ai/logician-ui src/theme/colors.ts */
    :root {
      --fc-primary: #1751d0;
      --fc-success: #1aa612;
      --fc-warning: #d0a117;
      --fc-danger: #c1232c;
      --fc-canvas: #fdfdff;
      --fc-subtle-bg: #f7f9fc;
      --fc-border: #cdd3e0;
      --fc-border-subtle: #e2e6f0;
      --fc-fg: #1e2433;
      --fc-fg-muted: #505a74;
      --fc-fg-subtle: #737d96;
      --fc-radius: 12px;

      --body-background-color: var(--fc-canvas) !important;
      --body-text-color: var(--fc-fg) !important;
      --card-background-color: #fff !important;
      --nav-background-color: #fff !important;
      --nav-border-bottom-color: var(--fc-border-subtle) !important;
      --card-border-color: var(--fc-border) !important;
      --nav-current-border-bottom-color: var(--fc-primary) !important;
      --up-border-left-color: var(--fc-success) !important;
      --degraded-border-left-color: var(--fc-warning) !important;
      --down-border-left-color: var(--fc-danger) !important;
      --tag-up-background-color: var(--fc-success) !important;
      --tag-degraded-background-color: var(--fc-warning) !important;
      --tag-down-background-color: var(--fc-danger) !important;
      --graph-opacity: 0 !important; /* 카드 배경 그래프는 막대와 겹쳐 지저분하다 */
    }

    body {
      font-family: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", -apple-system,
        BlinkMacSystemFont, sans-serif !important;
      background: var(--fc-canvas) !important;
      color: var(--fc-fg) !important;
      font-weight: 500 !important;
      line-height: 1.5 !important;
    }
    .container { max-width: 880px !important; padding: 0 20px !important; }
    nav { border-bottom: 1px solid var(--fc-border-subtle) !important; background: #fff !important; }
    nav ul { display: none !important; } /* Status/GitHub 탭 제거 — 로고와 제목만 남긴다 */

    h1 { font-size: 32px !important; font-weight: 700 !important; letter-spacing: -0.02em !important; }
    h2 { font-size: 20px !important; font-weight: 600 !important; color: var(--fc-fg) !important;
         letter-spacing: -0.01em !important; }
    h3 { font-size: 14px !important; font-weight: 600 !important; color: var(--fc-fg-subtle) !important;
         opacity: 1 !important; }
    h4 { font-size: 15px !important; font-weight: 600 !important; margin: 0 !important; }
    p.lead { color: var(--fc-fg-muted) !important; }
    a { text-decoration: none !important; color: inherit !important; }
    a:hover { text-decoration: underline !important; }

    /* ── 전체 상태 배너 ─────────────────────────────────────────── */
    article.up:not(.link),
    #fc-alert {
      border: 0 !important;
      border-radius: var(--fc-radius) !important;
      padding: 18px 20px !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      color: #fff !important;
      margin: 0 0 28px 0 !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }
    article.up:not(.link) { background: var(--fc-success) !important; }
    #fc-alert.degraded { background: var(--fc-warning) !important; }
    #fc-alert.down { background: var(--fc-danger) !important; }
    #fc-alert .fc-alert-sub {
      font-weight: 500 !important; font-size: 14px !important; opacity: 0.92 !important;
      margin-left: auto !important;
    }

    /* 진행 중인 장애 카드 — githubstatus 의 업데이트 타임라인 형태 */
    article.down.down-active {
      background: #fff !important;
      border: 1px solid var(--fc-warning) !important;
      border-left: 4px solid var(--fc-warning) !important;
      border-radius: var(--fc-radius) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    article.down.down-active > .f { padding: 16px 20px !important; }
    article.down.down-active h4 { color: var(--fc-fg) !important; }

    /* ── 컴포넌트 목록 ──────────────────────────────────────────── */
    section.live-status {
      border: 1px solid var(--fc-border-subtle) !important;
      border-radius: var(--fc-radius) !important;
      overflow: hidden !important;
      background: #fff !important;
    }
    section.live-status article {
      border: 0 !important; border-radius: 0 !important; background: #fff !important;
      padding: 20px !important; margin: 0 !important;
    }
    section.live-status article + article {
      border-top: 1px solid var(--fc-border-subtle) !important; margin-top: 0 !important;
    }
    section.live-status article h4 { display: flex !important; align-items: center !important; gap: 8px !important; }
    section.live-status .icon { width: 16px !important; height: 16px !important; }
    section.live-status article > div { font-size: 13px !important; color: var(--fc-fg-subtle) !important; }
    section.live-status article .data { color: var(--fc-fg) !important; font-weight: 600 !important; }

    /* 상태 점 — 이름 오른쪽 끝 */
    .fc-dot {
      margin-left: auto !important; width: 20px; height: 20px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; flex: none;
    }
    .fc-dot.up { background: var(--fc-success); }
    .fc-dot.degraded { background: var(--fc-warning); }
    .fc-dot.down { background: var(--fc-danger); }

    /* 기간 선택 탭(24h/7d/30d/1y/all) 숨김 — 막대는 항상 90일 기준이라 혼동만 준다.
       .changed 는 렌더 직후 500ms 만 붙었다 사라지므로 선택자에 쓰면 안 된다. */
    form.f.r { display: none !important; }

    /* ── 90일 가동률 막대 ───────────────────────────────────────── */
    .fc-bars { display: flex; gap: 2px; margin: 12px 0 8px; height: 34px; }
    /* 색은 JS 가 인라인으로 넣는다(다운타임 기반 그라디언트). 여기 배경은 데이터 없는 날 전용. */
    .fc-bar { flex: 1 1 0; border-radius: 2px; background: var(--fc-border-subtle);
              opacity: .82; transition: opacity .15s; }
    .fc-bar:hover { opacity: 1; }
    .fc-scale {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--fc-fg-subtle); font-weight: 500;
    }
    .fc-scale .fc-rule { flex: 1 1 auto; height: 1px; background: var(--fc-border-subtle); }
    .fc-legend-note { font-size: 12px; color: var(--fc-fg-subtle); margin-top: 4px; }

    /* 막대 툴팁 — 브라우저 기본 title 은 1초 지연 + OS 스타일이라 90칸을 훑기에 느리다.
       즉시 뜨는 커스텀 툴팁으로 대체한다(Statuspage 도 같은 방식). */
    .fc-tip {
      position: fixed; z-index: 50; pointer-events: none; opacity: 0;
      transform: translate(-50%, -100%); transition: opacity .1s;
      background: var(--fc-fg); color: #fff; border-radius: 8px;
      padding: 8px 10px; font-size: 12px; line-height: 1.45; font-weight: 500;
      white-space: nowrap; box-shadow: 0 4px 12px rgba(30, 36, 51, 0.18);
    }
    .fc-tip.on { opacity: 1; }
    .fc-tip .fc-tip-date { font-weight: 600; margin-bottom: 2px; }
    .fc-tip .fc-tip-sub { opacity: .75; }

    @media (max-width: 600px) {
      .fc-bars { height: 28px; gap: 1px; }
      h1 { font-size: 26px !important; }
    }
    </style><script>/* FactChat Status — Upptime 이 제공하지 않는 두 가지를 채운다.
       1) 컴포넌트별 가동률 막대 (history/daily.json — daily-uptime.mjs 가 생성, 창 길이는 days 필드)
       2) 모니터가 하나라도 정상이 아닐 때 상단 경고 배너
       Upptime 은 클라이언트에서 목록을 렌더하므로 DOM 이 준비될 때까지 폴링한다. */
    (function () {
      var OWNER = "mindlogic-ai",
        REPO = "factchat-status",
        RAW = "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/master";
      var daily = null;

      fetch(RAW + "/history/daily.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { daily = j; schedule(); })
        .catch(function () { daily = null; });

      function slugOf(article) {
        var a = article.querySelector('a[href*="/history/"]');
        if (!a) return null;
        var m = /\/history\/([^/?#]+)/.exec(a.getAttribute("href") || "");
        return m ? m[1] : null;
      }

      // 막대 색 — 3단계 구간이 아니라 그날 다운타임에 따른 연속 그라디언트.
      // 🚨 가동률 %에 선형 보간하면 안 된다. 실제 하루는 거의 100% 아니면 98~99%대라
      // 선형으로는 20분 장애가 초록의 98.6% 지점에 찍혀 사실상 안 보인다.
      // 그래서 "다운된 분"에 로그 스케일로 보간한다 — 0분 초록, 20분쯤 호박색,
      // 하루 종일(1440분) 빨강. 짧은 장애도 눈에 띄고 긴 장애와 구분도 된다.
      var C_UP = [26, 166, 18], C_MID = [208, 161, 23], C_DOWN = [193, 35, 44]; // success/warning/danger
      var LOG_FULL_DAY = Math.log(1441);

      function mix(a, b, t) {
        return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); });
      }

      function barColor(d) {
        if (!d || d.uptime === null || !d.seconds) return null; // 관측 없는 날 → CSS 기본 회색
        var downMinutes = (d.seconds * (1 - d.uptime / 100)) / 60;
        if (downMinutes <= 0) return "rgb(" + C_UP.join(",") + ")";
        var t = Math.min(1, Math.log(downMinutes + 1) / LOG_FULL_DAY);
        var c = t <= 0.5 ? mix(C_UP, C_MID, t / 0.5) : mix(C_MID, C_DOWN, (t - 0.5) / 0.5);
        return "rgb(" + c.join(",") + ")";
      }

      function emptyWindow() {
        // daily.json 이 아직 이 모니터를 모를 때(모니터 신규 추가·이름 변경으로 slug 가 바뀐 직후)
        // 그냥 return 하면 그 행만 막대가 통째로 사라진다. 회색 30칸으로 자리를 잡아둔다.
        var out = [];
        var n = (daily && daily.days) || 90;
        for (var i = 0; i < n; i++) out.push({ date: "", uptime: null, seconds: 0 });
        return out;
      }

      // ── 툴팁 ────────────────────────────────────────────────────
      var tipEl = null;

      function tipHtml(d) {
        if (!d.seconds) return "<div class='fc-tip-date'>" + (d.date || "") + "</div><div class='fc-tip-sub'>데이터 없음</div>";
        var downMinutes = (d.seconds * (1 - d.uptime / 100)) / 60;
        var sub = downMinutes >= 1
          ? "장애 " + Math.round(downMinutes) + "분 · 관측 " + Math.round(d.seconds / 36) / 100 + "시간"
          : "관측 " + Math.round(d.seconds / 36) / 100 + "시간";
        return "<div class='fc-tip-date'>" + d.date + " · 가동률 " + d.uptime + "%</div>" +
          "<div class='fc-tip-sub'>" + sub + "</div>";
      }

      function showTip(bar) {
        if (!tipEl) {
          tipEl = document.createElement("div");
          tipEl.className = "fc-tip";
          document.body.appendChild(tipEl);
        }
        tipEl.innerHTML = bar.dataset.tip || "";
        var r = bar.getBoundingClientRect();
        // 화면 밖으로 나가지 않게 좌우를 물린다(90칸이라 양 끝 막대가 잘리기 쉽다)
        var x = Math.min(window.innerWidth - 8, Math.max(8, r.left + r.width / 2));
        tipEl.style.left = x + "px";
        tipEl.style.top = r.top - 8 + "px";
        tipEl.classList.add("on");
      }

      function hideTip() {
        if (tipEl) tipEl.classList.remove("on");
      }

      function renderBars(article, slug) {
        if (!daily) return; // fetch 미완료 — 도착하면 schedule() 이 다시 부른다
        if (article.querySelector(".fc-bars")) return;
        var days = (daily.sites && daily.sites[slug]) || emptyWindow();
        var withData = days.filter(function (d) { return d.seconds > 0; });
        var avg = withData.length
          ? withData.reduce(function (s, d) { return s + d.uptime; }, 0) / withData.length
          : null;

        var bars = document.createElement("div");
        bars.className = "fc-bars";
        days.forEach(function (d) {
          var b = document.createElement("div");
          b.className = "fc-bar";
          var color = barColor(d);
          if (color) b.style.background = color;
          b.dataset.tip = tipHtml(d);
          bars.appendChild(b);
        });

        var scale = document.createElement("div");
        scale.className = "fc-scale";
        scale.innerHTML =
          "<span>" + (((daily && daily.days) || 90) + "일 전") + "</span><span class='fc-rule'></span><span>" +
          (avg === null ? "데이터 수집 중" : Math.round(avg * 100) / 100 + "% 가동") +
          "</span><span class='fc-rule'></span><span>오늘</span>";

        bars.addEventListener("mouseover", function (e) {
          if (e.target.classList && e.target.classList.contains("fc-bar")) showTip(e.target);
        });
        bars.addEventListener("mouseleave", hideTip);
        // 스크롤하면 fixed 툴팁만 제자리에 남는다
        window.addEventListener("scroll", hideTip, { passive: true });

        article.appendChild(bars);
        article.appendChild(scale);

        // 수집 기간이 30일 미만이면 그렇게 밝힌다. 빈 막대를 장애로 오해하지 않도록.
        if (withData.length < days.length) {
          var note = document.createElement("div");
          note.className = "fc-legend-note";
          note.textContent = withData.length
            ? "가동 이력 " + withData.length + "일 누적 — 회색은 수집 전 기간입니다"
            : "가동 이력 집계 대기 중 — 다음 정시에 채워집니다";
          article.appendChild(note);
        }
      }

      function renderDot(article) {
        var h4 = article.querySelector("h4");
        if (!h4 || h4.querySelector(".fc-dot")) return;
        var state = article.classList.contains("down")
          ? "down"
          : article.classList.contains("degraded")
          ? "degraded"
          : "up";
        var dot = document.createElement("span");
        dot.className = "fc-dot " + state;
        dot.textContent = state === "up" ? "✓" : "!";
        dot.setAttribute("aria-label", state === "up" ? "정상" : state === "down" ? "장애" : "성능 저하");
        h4.appendChild(dot);
      }

      function renderAlert(articles) {
        var down = 0, degraded = 0;
        articles.forEach(function (a) {
          if (a.classList.contains("down")) down++;
          else if (a.classList.contains("degraded")) degraded++;
        });
        var existing = document.getElementById("fc-alert");
        if (!down && !degraded) { if (existing) existing.remove(); return; }

        // 문제가 있으면 Upptime 의 "모두 정상" 배너는 사실과 다르므로 숨긴다
        var ok = document.querySelector("article.up:not(.link)");
        if (ok) ok.style.display = "none";

        var el = existing || document.createElement("div");
        el.id = "fc-alert";
        el.className = down ? "down" : "degraded";
        el.innerHTML =
          "<span>" +
          (down ? "서비스 " + down + "개 장애" : "서비스 " + degraded + "개 성능 저하") +
          "</span><span class='fc-alert-sub'>아래 목록에서 영향 범위를 확인하세요</span>";
        if (!existing) {
          var anchor = document.querySelector("section.live-status");
          if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(el, anchor);
        }
      }

      // Sapper 는 라우팅 시 DOM 을 통째로 갈아끼운다. 한 번만 그리면 상세 페이지에 갔다
      // 홈으로 돌아왔을 때 막대가 사라진다. 그래서 폴링 대신 DOM 변화를 계속 관찰한다.
      var pending = null;
      function render() {
        var articles = [].slice.call(document.querySelectorAll("section.live-status article"));
        if (!articles.length) return;
        articles.forEach(function (a) {
          renderDot(a);
          var s = slugOf(a);
          if (s) renderBars(a, s);
        });
        renderAlert(articles);
      }
      function schedule() {
        if (pending) clearTimeout(pending);
        // 우리가 넣은 노드도 observer 를 다시 깨우므로 디바운스로 루프를 막는다.
        // 렌더 함수들은 모두 멱등이라 중복 호출은 무해하다.
        pending = setTimeout(render, 120);
      }

      // 이 스크립트는 <head> 에서 실행된다. 그 시점엔 document.body 가 없어서
      // 바로 observe 하면 예외로 죽고(첫 로드만 우연히 그려짐) 라우팅 후 재렌더가 안 된다.
      function start() {
        schedule();
        new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
        window.addEventListener("popstate", schedule);
      }
      if (document.body) start();
      else document.addEventListener("DOMContentLoaded", start);
    })();
    </script><script>document.documentElement.lang="ko";</script>
  navbar: []
  theme: light
workflowSchedule:
